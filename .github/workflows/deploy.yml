name: Test and Deploy comment-service to Docker Hub

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: comment-service

jobs:
  test:
    name: Skip test (no tests configured)
    runs-on: ubuntu-latest
    steps:
      - name: No tests available
        run: echo "Skipping tests for comment-service..."

  deploy:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
